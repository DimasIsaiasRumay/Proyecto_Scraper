name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es la versión de referencia en producción; 3.12 detecta
        # deprecaciones antes de que obliguen a migrar a las apuradas; 3.13 es
        # el límite superior soportado (fijado por el pin de playwright en
        # scraper-fabricacion/requirements.txt).
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        # requirements-dev.txt incluye las deps de odoo-integration/ (requests,
        # python-dotenv): test_odoo_builders.py importa sync_projects/sync_tasks,
        # que las arrastran al nivel de módulo. Playwright NO está: no hace
        # falta ni el navegador (que es el grueso del tiempo de instalación),
        # porque la suite no toca el ERP. Si algún día un test importa
        # scraper.py o config.py, este job va a fallar — que es exactamente la
        # señal que se busca.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        # Sin .env: la suite debe correr en un clon limpio.
        run: pytest -q
